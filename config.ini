; HIS 服务端配置（与程序目录同放，迁移时一并拷贝）
[server]
strict_config = false
; 局域网部署用 0.0.0.0（其他电脑可访问）；仅本机用 127.0.0.1
host = 0.0.0.0
port = 8000
; 生产环境务必修改：管理台会话签名密钥
secret_key = CHANGE_ME_TO_A_RANDOM_LONG_STRING

[database]
; 留空 = 程序目录下 his.db；如需自定义填完整 URL，如 sqlite:///D:/HIS/data/his.db
url =

[insurance_catalog]
; 医保药品目录自动同步地址（CSV/XLSX）；留空 = 仅手动导入
url =

[public_health]
; 配置真实区域公卫平台后优先 HTTPS；留空则按 public_health_mock 决定
gateway_url =
gateway_token =

[insurance]
; 配置真实医保平台后优先 HTTPS；留空则按 insurance_mock 决定
gateway_url =
gateway_token =
; 国家医保平台门诊接口模板（2203/2204/2206/2207/2208）
national_url =
national_token =
national_org_code =
national_region_code =
national_operator = HIS

[sms]
; 配置真实网关后优先 HTTP 发送；留空则按 sms_mock 决定
gateway_url =
gateway_token =

[features]
; 医保总开关：false = 收费按全自费，禁止医保卡，打印不显示医保行
insurance = false
; 演示允许医保 Mock；生产模板关闭
insurance_mock = true
; 国家医保接口本地 mock；演示可开，生产关闭
insurance_national_mock = true
; 处方必须经药师审方后才能发药
prescription_review = true
; 演示/测试允许未配置支付通道时模拟成功；生产模板关闭
payment_mock = true
; 默认禁止匿名读；仅旧测试/演示可临时开启
anonymous_read = false
; 患者门户是否强制短信验证码（演示默认关闭）
portal_require_otp = false
; 演示允许短信 Mock；生产模板关闭
sms_mock = true
; 演示默认关闭；生产模板开启“收费+发药后才能配药”
nursing_require_paid_dispensed = false
; 检验报告前必须采样/签收；演示关闭，生产模板开启
lis_require_sample = false
; 公卫区域平台 Mock，演示开启、生产关闭
public_health_mock = true
; 超过该金额的退费只允许 admin/director
refund_approval_threshold = 500
; 自助机终端令牌；留空表示未配置终端，非演示模式拒绝
kiosk_token =

[clinic]
; 打印抬头，按实际诊所修改
name = 邹治国中西医结合诊所
address =
phone =
