; HIS 服务端配置（与程序目录同放，迁移时一并拷贝）
[server]
; 局域网部署用 0.0.0.0（其他电脑可访问）；仅本机用 127.0.0.1
host = 0.0.0.0
port = 8000
; 生产环境务必修改：管理台会话签名密钥
secret_key = CHANGE_ME_TO_A_RANDOM_LONG_STRING

[database]
; 留空 = 程序目录下 his.db；如需自定义填完整 URL，如 sqlite:///D:/HIS/data/his.db
url =

[insurance_catalog]
; 医保药品目录自动同步地址（CSV/XLSX）；留空 = 仅手动导入
url =

[features]
; 医保总开关：false = 收费按全自费，禁止医保卡，打印不显示医保行
insurance = false

[clinic]
; 打印抬头，按实际诊所修改
name = 邹治国中西医结合诊所
address =
phone =
