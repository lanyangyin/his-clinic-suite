:root{--bg:#f5f7fb;--card:#fff;--line:#e3e8f0;--text:#1f2937;--muted:#6b7280;--brand:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:#111827;color:#fff;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}

.who{margin-left:auto;color:#9ca3af}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}

.card .num{font-size:24px;font-weight:700;color:var(--brand)}
.card .label{color:var(--muted);margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
tr:hover td{background:#f9fafb}
form.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{padding:7px 9px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px;min-width:120px}
button{padding:8px 14px;border:0;border-radius:7px;background:var(--brand);color:#fff;cursor:pointer;font-size:14px}
button:hover{background:#1d4ed8}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827}
.login-card{background:#fff;border-radius:12px;padding:28px;width:340px}
.login-card h1{font-size:18px;margin:0 0 18px;text-align:center}
.login-card label{margin-bottom:10px}
.login-card button{width:100%;margin-top:8px}
.hint{color:var(--muted);font-size:12px;margin-top:12px;text-align:center}
