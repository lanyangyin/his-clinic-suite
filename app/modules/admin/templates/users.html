{% extends "base.html" %}
{% block title %}用户 · HIS 管理台{% endblock %}
{% block content %}
<h2>系统账号</h2>
<div class="panel">
  <form class="inline" method="post" action="/admin/users">
    <label>账号 <input type="text" name="username" required maxlength="50"></label>
    <label>密码 <input type="password" name="password" required></label>
    <label>角色
      <select name="role">
        {% for role in roles %}
        <option value="{{ role }}">{{ role|zh('role') }}</option>
        {% endfor %}
      </select>
    </label>
    <label>显示名 <input type="text" name="display_name" maxlength="50"></label>
    <button type="submit">新增账号</button>
  </form>
  <table>
    <tr><th>ID</th><th>账号</th><th>角色</th><th>显示名</th><th>状态</th><th>操作</th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.role|zh('role') }}</td><td>{{ u.display_name }}</td>
      <td>{{ '启用' if u.is_active else '停用' }}</td>
      <td>
        <form method="post" action="/admin/users/{{ u.id }}/toggle" style="display:inline"><button type="submit">{{ '停用' if u.is_active else '启用' }}</button></form>
        <form method="post" action="/admin/users/{{ u.id }}/reset-password" style="display:inline"><input name="password" type="password" placeholder="新密码（≥6位）" style="width:130px"><button type="submit">重置密码</button></form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="6">暂无账号</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
